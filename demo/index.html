<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>axon demo · 螺旋分类</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1015;
        --panel: #12181f;
        --line: #2a343f;
        --ink: #edf2f6;
        --muted: #94a3b0;
        --dim: #66757f;
        --accent: #f0a93a;
        --accent-soft: #ffd489;
        --cyan: #7fd3e6;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-family: "Avenir Next", ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        padding: 28px 20px 48px; line-height: 1.6;
        background-color: var(--bg);
        background-image:
          linear-gradient(#f0a93a0a 1px, transparent 1px),
          linear-gradient(90deg, #f0a93a0a 1px, transparent 1px);
        background-size: 36px 36px;
      }

      .wrap { max-width: 940px; margin: 0 auto; }

      header {
        position: relative; margin-bottom: 18px; padding: 18px 20px 20px;
        border: 1px solid var(--line); background: #0d1218e8;
      }
      header::before {
        content: "AXN // SPIRAL.CLASSIFIER // LIVE TRAINING";
        display: block; margin-bottom: 17px; padding-bottom: 9px; border-bottom: 1px solid var(--line);
        color: var(--accent); font: 650 10px/1.3 var(--mono); letter-spacing: .08em;
      }
      header::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
        background: repeating-linear-gradient(90deg, #f0a93a59 0 12px, transparent 12px 26px);
      }
      h1 { font-size: 26px; font-weight: 750; letter-spacing: 0; }
      .sub { max-width: 760px; margin-top: 8px; color: var(--muted); font-size: 14px; }
      .sub code {
        padding: 2px 5px; border: 1px solid var(--line); background: #111820;
        color: #d9e7f1; font: 600 13px/1.4 var(--mono);
      }

      .stage {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }

      canvas {
        width: 100%;
        background: #0b1116;
        border: 1px solid var(--line);
        display: block;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 0;
      }

      .stat {
        display: flex; justify-content: space-between; gap: 14px; margin: 0 16px;
        padding: 10px 0; border-bottom: 1px solid #ffffff0c;
        color: var(--muted); font: 600 11px/1.4 var(--mono); letter-spacing: .03em;
      }
      .stat span:first-child { color: var(--dim); }
      .stat span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700; }

      .bar {
        height: 4px;
        background: #ffffff10;
        overflow: hidden;
        margin: 18px 16px 4px;
      }
      .bar > i { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 9px #f0a93a88; transition: width .1s linear; }

      .controls { display: grid; gap: 7px; margin-top: 16px; padding: 0 16px 16px; }

      button {
        min-height: 40px;
        padding: 9px 14px;
        border-radius: 0;
        border: 1px solid var(--line);
        background: #182029;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s ease;
      }
      button:hover:not(:disabled) { background: #1b232c; border-color: #4a5764; }
      button:disabled { opacity: .4; cursor: not-allowed; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #171104; }
      button.primary:hover:not(:disabled) { background: #ffd489; border-color: #ffd489; }

      .note {
        margin-top: 14px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        background: var(--panel);
        font-size: 13px;
        line-height: 1.65;
        color: var(--muted);
      }
      .note b { color: var(--ink); }

      .legend {
        display: flex; flex-wrap: wrap; gap: 12px 16px; margin-top: 10px;
        color: var(--muted); font: 600 10px/1.4 var(--mono); letter-spacing: .03em;
      }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

      @media (max-width: 480px) {
        body { padding: 18px 14px 36px; }
        header { padding: 16px; }
        h1 { font-size: 23px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>axon · 螺旋分类</h1>
        <p class="sub">
          零依赖神经网络框架在浏览器里实时训练。两层 ReLU 网络，看决策边界如何从混乱收敛到清晰。
          全部计算来自 <code>../src/</code>，无任何外部依赖。
        </p>
      </header>

      <div class="stage">
        <div>
          <canvas id="view" width="600" height="600"></canvas>
          <div class="legend">
            <span><i class="dot" style="background:#f0a93a"></i>类别 A</span>
            <span><i class="dot" style="background:#7fd3e6"></i>类别 B</span>
            <span><i class="dot" style="background:#ffffff40"></i>正确</span>
            <span><i class="dot" style="background:#ff6f61"></i>误分类</span>
          </div>
        </div>

        <div class="panel">
          <div class="stat"><span>训练轮次</span><span id="epoch">0</span></div>
          <div class="stat"><span>损失</span><span id="loss">—</span></div>
          <div class="stat"><span>准确率</span><span id="acc">—</span></div>
          <div class="stat"><span>速度</span><span id="speed">—</span></div>
          <div class="stat"><span>参数量</span><span id="params">—</span></div>

          <div class="bar"><i id="bar" style="width:0%"></i></div>

          <div class="controls">
            <button id="start" class="primary">开始训练</button>
            <button id="pause" disabled>暂停</button>
            <button id="reset">重置</button>
          </div>
        </div>
      </div>

      <p class="note">
        <b>你在看什么：</b>背景色是网络当前输出的决策区域，随训练推进从斑驳逐渐变干净。
        螺旋数据集无法用一条直线分开，必须靠非线性层才能学会——如果这里的网络只有一层，
        准确率会卡在 50% 左右。
      </p>
    </div>

    <script type="module" src="./spiral.js"></script>
  </body>
</html>
<!-- build_type 切换后的重新部署触发 -->
