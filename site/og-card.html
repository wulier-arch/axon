<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #ece8f7;
        background: #0d0d16;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background:
          linear-gradient(90deg, #0d0d16 0%, #0d0d16 63%, #12121d 100%);
      }
      .card {
        width: 1200px;
        height: 630px;
        padding: 58px 62px;
        display: grid;
        grid-template-columns: 1fr 510px;
        gap: 42px;
        align-items: center;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #c3b4ff;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: .11em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #4ad6c8;
        box-shadow: 0 0 0 5px #4ad6c822;
      }
      h1 {
        margin-top: 22px;
        font-size: 66px;
        line-height: .98;
        letter-spacing: -.045em;
        font-weight: 850;
      }
      h1 span { display: block; color: #b9a6ff; }
      .lede {
        margin-top: 24px;
        max-width: 570px;
        color: #b9b2d0;
        font-size: 21px;
        line-height: 1.45;
      }
      .chips {
        display: flex;
        gap: 9px;
        margin-top: 27px;
      }
      .chip {
        padding: 7px 12px;
        border: 1px solid #ffffff18;
        border-radius: 999px;
        background: #ffffff0a;
        color: #aaa4c0;
        font-size: 13px;
        font-weight: 700;
      }
      .chip.ok { color: #8ce8dd; border-color: #4ad6c844; background: #4ad6c81a; }
      .url {
        margin-top: 31px;
        color: #6f6a86;
        font-size: 14px;
        font-weight: 650;
      }
      .preview {
        padding: 12px;
        border: 1px solid #ffffff18;
        border-radius: 22px;
        background: #14141f;
        box-shadow: 0 28px 80px #00000055;
      }
      .preview img {
        display: block;
        width: 484px;
        height: 254px;
        object-fit: cover;
        border-radius: 14px;
        background: #14141f;
      }
      .caption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 3px 1px;
        color: #9d96b8;
        font-size: 12.5px;
      }
      .caption b { color: #8ce8dd; font-weight: 750; }
    </style>
  </head>
  <body>
    <main class="card">
      <section>
        <div class="eyebrow">Zero-dependency neural network</div>
        <h1>Neural networks,<span>from first principles.</span></h1>
        <p class="lede">
          Autograd, tensors, convolution, and training loops, all written by hand
          in readable JavaScript.
        </p>
        <div class="chips">
          <span class="chip ok">0 dependencies</span>
          <span class="chip">80 tests</span>
          <span class="chip">Browser + Node</span>
        </div>
        <div class="url">github.com/wulier-arch/axon</div>
      </section>
      <section class="preview">
        <img src="./og-demo.png" alt="axon training a spiral classifier in the browser">
        <div class="caption">
          <span>Live spiral training</span>
          <span><b>100% accuracy</b> · 220 epochs</span>
        </div>
      </section>
    </main>
  </body>
</html>
